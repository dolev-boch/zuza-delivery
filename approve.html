<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>אישור עדכון הזמנה - Zuza</title>
    <style>
      :root {
        --dark-green: #1a2f2f;
        --gold: #c4a575;
        --text: #333;
        --white: #fff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        background: #f5f5f5;
        color: var(--text);
      }
      .header {
        background: linear-gradient(135deg, #1a2f2f 0%, #2d4a4a 100%);
        padding: 24px 16px;
        text-align: center;
      }
      .logo {
        color: var(--gold);
        font-size: 32px;
        font-family: Georgia, serif;
        font-style: italic;
      }
      .subtitle {
        color: var(--gold);
        font-size: 18px;
        margin-top: 8px;
      }
      .container {
        max-width: 640px;
        margin: 0 auto;
        padding: 16px;
      }
      .card {
        background: var(--white);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        margin-bottom: 16px;
      }
      .info-row {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        font-size: 15px;
      }
      .info-label {
        color: #666;
      }
      .note {
        background: #fff3cd;
        border-right: 4px solid #ff9800;
        border-radius: 8px;
        padding: 12px 14px;
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 16px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 10px 8px;
        border-bottom: 1px solid #eee;
        font-size: 15px;
      }
      th {
        background: #f5f5f5;
        text-align: right;
      }
      .num {
        text-align: center;
        white-space: nowrap;
      }
      .old {
        color: #888;
        text-decoration: line-through;
      }
      .new {
        font-weight: 700;
        color: var(--dark-green);
      }
      .btn {
        display: block;
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 12px;
        background: #4caf50;
        color: #fff;
        font-size: 18px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .status {
        text-align: center;
        font-size: 17px;
        line-height: 1.6;
      }
      .status.ok {
        color: #2e7d32;
      }
      .status.err {
        color: #c62828;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">Zuza</div>
      <div class="subtitle">אישור עדכון להזמנה קיימת</div>
    </div>

    <div class="container">
      <div class="card status" id="loading">טוען את בקשת העדכון...</div>

      <div id="content" class="hidden">
        <div class="card">
          <div class="info-row">
            <span class="info-label">תאריך הזמנה:</span><b id="deliveryDate"></b>
          </div>
          <div class="info-row">
            <span class="info-label">נשלח על ידי:</span><b id="fillerName"></b>
          </div>
          <div class="info-row">
            <span class="info-label">זמן הבקשה:</span><b id="createdAt"></b>
          </div>
        </div>

        <div class="card">
          <div class="note">
            באישור, הכמות של כל מוצר ברשימה <b>תוחלף</b> בכמות המעודכנת (לא תתווסף ולא תופחת).
            מוצרים שלא ברשימה לא ישתנו.
          </div>
          <table>
            <thead>
              <tr>
                <th>מוצר</th>
                <th class="num">כמות נוכחית</th>
                <th class="num">כמות מעודכנת</th>
              </tr>
            </thead>
            <tbody id="productsBody"></tbody>
          </table>
        </div>

        <div class="card" id="actionCard">
          <button class="btn" id="approveBtn" onclick="approve()">אישור והחלפת הכמויות בקובץ</button>
        </div>
      </div>

      <div class="card status hidden" id="result"></div>
    </div>

    <script src="order-update.js"></script>
    <script>
      const SCRIPT_URL =
        'https://script.google.com/macros/s/AKfycbzdxZEpJPFaFtYiDDKa_4BmNWsehU8RENKq6TpgODu5-kcREwWIwJ7LjnkkjzWM1QpSgA/exec';

      const params = new URLSearchParams(window.location.search);
      const requestId = params.get('id');
      const token = params.get('token');

      function escapeHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function showResult(text, ok) {
        const el = document.getElementById('result');
        el.textContent = text;
        el.className = `card status ${ok ? 'ok' : 'err'}`;
      }

      function apiUrl(action) {
        return (
          `${SCRIPT_URL}?action=${action}&id=${encodeURIComponent(requestId)}` +
          `&token=${encodeURIComponent(token)}`
        );
      }

      function markApproved(approvedAt) {
        document.getElementById('actionCard').classList.add('hidden');
        showResult(`✓ השינויים אושרו ועודכנו בקובץ${approvedAt ? ` (${approvedAt})` : ''}.`, true);
      }

      async function load() {
        if (!requestId || !token) {
          document.getElementById('loading').classList.add('hidden');
          return showResult('הקישור חסר או שגוי.', false);
        }
        try {
          const result = await ZuzaOrderUpdate.fetchJsonWithRetry(apiUrl('get_update_request'), {
            attempts: 4,
          });
          if (!result.success) throw new Error(result.error || 'הבקשה לא נמצאה');
          const req = result.request;

          document.getElementById('deliveryDate').textContent = req.delivery_date;
          document.getElementById('fillerName').textContent = req.filler_name || '-';
          document.getElementById('createdAt').textContent = req.created_at;
          document.getElementById('productsBody').innerHTML = req.products
            .map(
              (p) => `<tr>
                <td>${escapeHtml(p.name)}</td>
                <td class="num ${p.current_quantity !== p.new_quantity ? 'old' : ''}">${p.current_quantity}</td>
                <td class="num new">${p.new_quantity}</td>
              </tr>`
            )
            .join('');

          document.getElementById('loading').classList.add('hidden');
          document.getElementById('content').classList.remove('hidden');
          if (req.status === 'approved') markApproved(req.approved_at);
        } catch (err) {
          document.getElementById('loading').classList.add('hidden');
          showResult(`שגיאה בטעינת הבקשה: ${err.message}`, false);
        }
      }

      async function approve() {
        const btn = document.getElementById('approveBtn');
        if (!confirm('לאשר ולהחליף את הכמויות בקובץ?')) return;
        btn.disabled = true;
        btn.textContent = 'מעדכן...';
        try {
          // approve_update is idempotent server-side (already-approved requests
          // are never applied twice), so retrying on a lost response is safe.
          const result = await ZuzaOrderUpdate.fetchJsonWithRetry(apiUrl('approve_update'), {
            attempts: 3,
          });
          if (!result.success) throw new Error(result.error || 'שגיאת שרת');
          markApproved(result.approved_at);
        } catch (err) {
          btn.disabled = false;
          btn.textContent = 'אישור והחלפת הכמויות בקובץ';
          showResult(`שגיאה באישור: ${err.message}. נסה שוב.`, false);
        }
      }

      load();
    </script>
  </body>
</html>
